# Modular fragment — portable runnable tasks for InstituteOS.
# Deep-merged over config.yaml at load time (instituteos.platform.aii_sidecar).
tasks:
  validate:
    cmd: python3 scripts/ontology.py validate --strict
    description: Verify source, generated artifacts, release hashes, and contracts.
  build:
    cmd: python3 scripts/ontology.py build
    description: Regenerate the version 2 JSON export.
  lint:
    cmd: python3 scripts/ontology.py validate --strict
    description: Validate the structured source and all generated artifacts.
  schema-check:
    cmd: python3 scripts/ontology.py schema-check
    description: Validate live documents against the published JSON Schemas.
  audit-csv:
    cmd: python3 scripts/ontology.py audit-csv Ontology_v5_May_25_2023.csv
    description: Report CSV shape, duplicate-label, and generated-ID diagnostics.
  report:
    cmd: python3 scripts/ontology.py report
    description: Print quality, integrity, and release validation results.
  site:
    cmd: python3 scripts/ontology.py site
    description: Regenerate the dependency-free browsable site.
  manuscript-generate:
    cmd: python3 scripts/manuscript.py generate
    description: Generate manuscript variables, figures, tables, and resolved sections.
  manuscript-validate:
    cmd: python3 scripts/manuscript.py validate --strict
    description: Validate manuscript structure, references, figures, hashes, and rendered outputs.
  manuscript-render:
    cmd: python3 scripts/manuscript.py render --format all
    description: Render PDF, HTML, DOCX, and EPUB publication artifacts.
  manuscript-check:
    cmd: python3 scripts/manuscript.py check
    description: Verify manuscript freshness and publication manifest integrity.
