name: Ontology

# Public gates for the ontology pipeline and the manuscript.
#
# `.aii/` is validated by the InstituteOS sidecar validator, which lives in a private
# kernel package and therefore cannot be installed here without credentials. This workflow
# runs only dependency-free gates; the regression suite carries a structural check of
# `.aii/`, and the authoritative validator is a documented private step (see "Private and
# manual checks" in docs/build-and-validation.md).
#
# Figure PNG bytes are rasterized per host, so the committed figures are not reproducible
# on the runner. The manuscript job regenerates the publication artifacts in the CI
# toolchain and then requires byte-identity for every rasterizer-independent artifact.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned GNN parser
        run: |
          python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
          python -m pip install --disable-pip-version-check psutil
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          pin = json.loads(Path(".github/gnn-pin.json").read_text(encoding="utf-8"))
          assert pin["repository"] == "ActiveInferenceInstitute/Generalized_Notation_Notation"
          spec = (
              "generalized-notation-notation @ "
              f"git+https://github.com/{pin['repository']}.git@{pin['revision']}"
          )
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--disable-pip-version-check", "--no-deps", spec]
          )
          PY
      - name: Verify pinned vocabulary and bridge
        run: python3 scripts/validate_gnn_conformance.py
      - name: Verify generated bridge freshness
        run: python3 scripts/ontology.py gnn-terms --check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install --requirement requirements-ci.txt
      - name: Install pinned manuscript dependencies
        run: python -m pip install --requirement requirements-manuscript.txt
      - name: Show Python version
        run: python3 --version
      - name: Validate ontology source and generated artifacts
        run: python3 scripts/ontology.py validate --strict
      - name: Validate published JSON Schemas
        run: python3 scripts/ontology.py schema-check
      - name: Verify generated JSON
        run: python3 scripts/ontology.py build --check
      - name: Verify spreadsheet export
        run: python3 scripts/ontology.py export-csv --check
      - name: Verify browsable site
        run: python3 scripts/ontology.py site --check
      - name: Verify GNN vocabulary bridge
        run: python3 scripts/ontology.py gnn-terms --check
      - name: Build validation report
        run: python3 scripts/ontology.py report > /tmp/ontology-validation-report.json
      - name: Run ontology regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify v2 diff command
        run: python3 scripts/ontology.py diff ontology.source.json ontology.source.json > /tmp/ontology-release-diff.json

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned manuscript dependencies
        run: |
          python -m pip install --requirement requirements-ci.txt
          python -m pip install --requirement requirements-manuscript.txt
      - name: Regenerate publication artifacts in the CI toolchain
        run: |
          python3 scripts/manuscript.py generate
          python3 scripts/manuscript.py manifest
      - name: Verify rasterizer-independent artifacts match their committed bytes
        run: >-
          git diff --exit-code --
          docs/manuscript
          ':(exclude)docs/manuscript/output/figures/**'
          ':(exclude)docs/manuscript/artifact-manifest.json'
      - name: Verify manuscript structure and hashes
        run: python3 scripts/manuscript.py validate --strict
      - name: Verify manuscript freshness
        run: python3 scripts/manuscript.py check
      - name: Verify repository whitespace
        run: git diff --check
