name: Ontology

# Public gates for the ontology pipeline and the manuscript.
#
# Every job installs one pinned environment and then calls a gate arm from
# `run.sh`; the arms are the only definition of the commands (see
# `docs/build-and-validation.md`), so a local `./run.sh all` runs exactly what
# this workflow runs. Two jobs stay separate only where the environment differs:
# `gnn-conformance` installs the pinned GNN parser and `gate` does not.
#
# `.aii/` is validated by the InstituteOS sidecar validator, which lives in a private
# kernel package and therefore cannot be installed here without credentials. This workflow
# runs only dependency-free gates; the regression suite carries a structural check of
# `.aii/`, and the authoritative validator is a documented private step (see "Private and
# manual checks" in docs/build-and-validation.md).
#
# Figure PNG bytes are rasterized per host, so the committed figures are not reproducible
# on the runner. The `manuscript` arm regenerates the publication artifacts in the CI
# toolchain and then requires byte-identity for every rasterizer-independent artifact.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pinned dependencies
        run: ./run.sh deps
      - name: Lint
        run: ./run.sh lint
      - name: Ontology contract and generated artifacts
        run: ./run.sh ontology
      - name: Manuscript freshness
        run: ./run.sh manuscript
      - name: Regression suite
        run: ./run.sh full
      - name: Documentation links, anchors, and index
        run: ./run.sh docs

  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify pinned GNN parser and vocabulary bridge
        run: ./run.sh gnn
